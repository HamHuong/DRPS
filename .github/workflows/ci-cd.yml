name: DRPS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run Pytest
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev gcc

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        # Cài đặt thư viện test
        pip install pytest httpx
        # Cài đặt requirements của backend
        if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

    - name: Execute Test Cases
      run: |
        cd backend
        pytest tests/ -v --maxfail=5 --disable-warnings

  build:
    name: Build Docker Images
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Build Backend Image
      run: |
        docker build -t drps-backend ./backend
        
    - name: Build Frontend Image
      run: |
        docker build -t drps-frontend ./frontend
        
    - name: Success Message
      run: |
        echo "✅ Pipeline hoàn tất: Test thành công và Build Docker Image thành công!"
